<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Encyclopedia of Flowers — Trang Web sưu tầm các loài hoa của Tr Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dk:#022539;--gr:#184A3A;--grl:#6A9E7B;--grl2:#DAF0D0;
  --gold:#2B7A4B;--gold-bg:#D6F0D8;
  --bg:#DDE9D5;--card:#EEF4EA;--side:#2B6B50;
  --tx:#0A1F18;--tx2:#2E4A3C;--tx3:#5C7D6C;--tx4:#8DAA99;
  --bd:#C1D8BA;--bd2:#D2E4CC;
  --sh:0 1px 4px rgba(2,37,57,.07);--sh2:0 4px 20px rgba(2,37,57,.1);
  --nav-h:54px;--side-w:272px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --dk:#8BC9A0;--gr:#6AAE80;--grl:#3A7A55;--grl2:#162E22;
  --gold:#6AAE80;--gold-bg:#1A2E22;
  --bg:#0C1610;--card:#142018;--side:#1A3D2E;
  --tx:#D4E6D9;--tx2:#9AB8A6;--tx3:#5C7D6C;--tx4:#354D42;
  --bd:#1E3328;--bd2:#172820;--sh:0 1px 4px rgba(0,0,0,.4);--sh2:0 4px 20px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --dk:#8BC9A0;--gr:#6AAE80;--grl:#3A7A55;--grl2:#162E22;
  --gold:#6AAE80;--gold-bg:#1A2E22;
  --bg:#0C1610;--card:#142018;--side:#1A3D2E;
  --tx:#D4E6D9;--tx2:#9AB8A6;--tx3:#5C7D6C;--tx4:#354D42;
  --bd:#1E3328;--bd2:#172820;--sh:0 1px 4px rgba(0,0,0,.4);--sh2:0 4px 20px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:calc(var(--nav-h)+12px);scroll-behavior:smooth}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.dsp{font-family:'Playfair Display',Georgia,serif}
button,input{font-family:inherit}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);background:var(--side);color:#fff;display:flex;align-items:center;padding:0 16px;gap:12px}
.nav-brand{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px;opacity:.95;flex-shrink:0;text-decoration:none;color:#fff}
.nav-sub{font-family:'Work Sans',sans-serif;font-size:.6rem;font-weight:400;opacity:.5;display:block;font-style:italic;letter-spacing:.01em}
.ham{display:none;width:34px;height:34px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:1.1rem;border-radius:6px;flex-shrink:0;cursor:pointer}
.sbox{flex:1;max-width:400px;position:relative}
.sbox input{width:100%;padding:8px 12px 8px 34px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:rgba(255,255,255,.08);color:#fff;font-size:.85rem;outline:none;transition:all .2s}
.sbox input:focus{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.sbox input::placeholder{color:rgba(255,255,255,.45)}
.sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);pointer-events:none}
.nav-r{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.nb{padding:6px 12px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:transparent;color:rgba(255,255,255,.75);font-size:.78rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.nb:hover,.nb.on{background:rgba(255,255,255,.15);color:#fff}
.vt{display:flex;border:1px solid rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.vb{padding:6px 9px;background:transparent;border:none;color:rgba(255,255,255,.45);font-size:.88rem;cursor:pointer}
.vb.on{background:#184A3A;color:#BAF187}

/* LAYOUT */
.wrap{display:flex;margin-top:var(--nav-h)}
.side-l{width:var(--side-w);position:fixed;top:var(--nav-h);bottom:0;left:0;background:var(--side);overflow-y:auto;padding:12px 0;z-index:50;transition:transform .3s}
.side-l::-webkit-scrollbar{width:4px}.side-l::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.side-r{width:var(--side-w);position:fixed;top:var(--nav-h);bottom:0;right:0;background:var(--card);border-left:1px solid var(--bd);overflow-y:auto;padding:0;z-index:50;transition:transform .3s}
.side-r::-webkit-scrollbar{width:4px}.side-r::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.mn{margin-left:var(--side-w);margin-right:var(--side-w);flex:1;padding:20px 24px;min-height:calc(100vh - var(--nav-h))}
@media(max-width:1100px){
  .side-r{transform:translateX(100%)}
  .side-r.open{transform:translateX(0);box-shadow:var(--sh2)}
  .mn{margin-right:0}
}
@media(max-width:900px){
  .ham{display:flex;align-items:center;justify-content:center}
  .side-l{transform:translateX(-100%)}
  .side-l.open{transform:translateX(0);box-shadow:var(--sh2)}
  .side-r{transform:translateX(100%)}
  .side-r.open{transform:translateX(0);box-shadow:var(--sh2)}
  .mn{margin-left:0;margin-right:0}
  .nb .lbl{display:none}
}
@media(max-width:480px){.mn{padding:14px 12px}.nav{padding:0 10px;gap:8px}.nav-brand span{display:none}}

/* RIGHT SIDEBAR (Chi) */
.sr-header{padding:14px 16px 10px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card);z-index:2}
.sr-title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--dk);margin-bottom:2px}
.sr-sub{font-size:.7rem;color:var(--tx4);font-style:italic}
.sr-empty{padding:32px 16px;text-align:center;color:var(--tx4);font-size:.82rem;line-height:1.5}
.sr-empty .big{font-size:2rem;margin-bottom:8px;opacity:.5}
.sr-fam-tag{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:100px;margin-bottom:8px}
/* Genus item in right sidebar */
.gi{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd2);cursor:pointer;transition:all .12s}
.gi:hover{background:var(--bg)}
.gi.on{background:var(--grl2);border-left:3px solid var(--gr)}
.gi-info{flex:1;min-width:0}
.gi-name{font-family:'Playfair Display',serif;font-size:.88rem;font-weight:600;font-style:italic;color:var(--dk)}
.gi-detail{font-size:.7rem;color:var(--tx4);margin-top:1px}
.gi-count{font-size:.68rem;font-weight:600;background:var(--bd2);color:var(--tx3);padding:2px 8px;border-radius:100px;flex-shrink:0}
.gi.on .gi-count{background:var(--gr);color:#fff}
.gi-species{padding:0 16px 6px 38px}
.gi-sp{font-size:.72rem;color:var(--tx3);padding:3px 0;display:flex;align-items:center;gap:6px;cursor:pointer;transition:color .12s}
.gi-sp:hover{color:var(--gr)}
.gi-sp .sp-e{font-size:.85rem}
.sr-toggle{display:none;position:fixed;bottom:72px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--dk);color:#BAF187;border:none;font-size:1.1rem;box-shadow:var(--sh2);z-index:55;cursor:pointer}
@media(max-width:1100px){.sr-toggle{display:flex;align-items:center;justify-content:center}}

/* SIDEBAR ITEMS */
.sh{font-size:.65rem;font-weight:600;color:rgba(255,255,255,.35);padding:14px 16px 4px;letter-spacing:.04em}
.si{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:.82rem;color:rgba(255,255,255,.6);border:none;background:none;width:100%;text-align:left;cursor:pointer;transition:all .12s}
.si:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.si.on{background:rgba(255,255,255,.08);color:#fff}
.si .c{margin-left:auto;font-size:.68rem;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:100px;color:rgba(255,255,255,.4)}
.si.on .c{background:rgba(255,255,255,.2);color:rgba(255,255,255,.8)}
.sdiv{height:1px;background:rgba(255,255,255,.08);margin:8px 16px}
/* Family item (two-line) */
.fi{display:flex;align-items:center;gap:10px;padding:10px 16px;border:none;background:none;width:100%;text-align:left;cursor:pointer;transition:all .12s;border-left:3px solid transparent}
.fi:hover{background:rgba(255,255,255,.06)}
.fi.on{background:rgba(255,255,255,.08);border-left-color:#BAF187}
.fi-info{flex:1;min-width:0}
.fi-latin{font-family:'Playfair Display',serif;font-size:.82rem;font-weight:600;font-style:italic;color:rgba(255,255,255,.85);line-height:1.2}
.fi.on .fi-latin{color:#BAF187}
.fi-vn{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:1px}
.fi.on .fi-vn{color:rgba(255,255,255,.65)}
.fi-cnt{font-size:.62rem;font-weight:600;background:rgba(255,255,255,.08);color:rgba(255,255,255,.3);padding:2px 7px;border-radius:100px;flex-shrink:0}
.fi.on .fi-cnt{background:rgba(186,241,135,.15);color:rgba(186,241,135,.7)}

/* FAMILY HEADER */
.fam-hdr{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden}
.fam-hdr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:10px 0 0 10px}
.fam-badge{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;color:#184A3A;background:#BAF187;padding:3px 10px;border-radius:100px;margin-bottom:10px}
.fam-name{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--dk);margin-bottom:2px}
.fam-latin{font-style:italic;font-size:.9rem;color:var(--tx3);margin-bottom:10px}
.fam-desc{font-size:.88rem;color:var(--tx2);line-height:1.7;max-width:680px}
.fam-stats{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
.fam-stat{font-size:.78rem;color:var(--tx3)}
.fam-stat b{color:var(--tx2);font-weight:600}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:32px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.cd:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.cd-v{height:150px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.cd-v::before{content:'';position:absolute;inset:0;opacity:.08;background:radial-gradient(circle at 30% 60%,currentColor,transparent 70%)}
.cd-v.has-img{height:170px}
.cd-v.has-img::before{display:none}
.cd-img{width:100%;height:100%;object-fit:cover}
.cd-b{padding:14px}
.cd-fam{font-size:.65rem;font-weight:600;color:var(--gr);margin-bottom:3px}
.cd-n{font-family:'Playfair Display',serif;font-size:1.02rem;font-weight:700;line-height:1.25;margin-bottom:1px}
.cd-l{font-style:italic;font-size:.73rem;color:var(--tx4);margin-bottom:6px}
.cd-d{font-size:.78rem;color:var(--tx3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd-f{padding:0 14px 12px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.64rem;padding:2px 7px;border-radius:100px;background:#C1D8BA;color:#184A3A;font-weight:500}
.cd-acts{position:absolute;top:8px;right:8px;display:flex;gap:3px;z-index:2}
.ca{width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.78rem;cursor:pointer;transition:all .12s;opacity:.7}
.ca:hover,.ca.bk{opacity:1;background:#184A3A;color:#BAF187;border-color:#184A3A}
.ca.cp{opacity:1;background:var(--gr);color:#fff;border-color:var(--gr)}

/* LIST */
.lst{display:flex;flex-direction:column;gap:6px;margin-bottom:32px}
.li{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:6px;cursor:pointer;transition:box-shadow .12s}
.li:hover{box-shadow:var(--sh)}
.li-e{font-size:1.6rem;width:40px;text-align:center;flex-shrink:0}
.li-i{flex:1;min-width:0}
.li-n{font-weight:600;font-size:.88rem}
.li-l{font-style:italic;font-size:.73rem;color:var(--tx4)}
.li-m{display:flex;gap:10px;font-size:.73rem;color:var(--tx3);margin-top:1px}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;overflow-y:auto;padding:20px}
.mo.open{display:flex;align-items:flex-start;justify-content:center;padding-top:32px}
.det{background:var(--card);border-radius:10px;max-width:700px;width:100%;box-shadow:var(--sh2);position:relative;margin-bottom:32px}
.det-hero{height:170px;display:flex;align-items:center;justify-content:center;font-size:5rem;border-radius:10px 10px 0 0;position:relative;overflow:hidden}
.det-hero::before{content:'';position:absolute;inset:0;opacity:.1;background:radial-gradient(circle at 40% 50%,currentColor,transparent 70%)}
.det-hero.has-img{background:#000!important}
.det-hero.has-img::before{display:none}
.det-hero-img{width:100%;height:100%;object-fit:cover;opacity:.9}
.img-credit{position:absolute;bottom:0;left:0;right:0;padding:6px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:rgba(255,255,255,.7);font-size:.65rem;text-align:right}
.img-credit a{color:rgba(255,255,255,.85);text-decoration:underline}
/* Form image upload */
.frm-upload-area{border:2px dashed var(--bd);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.frm-upload-area:hover{border-color:var(--gr);background:var(--grl2)}
.frm-upload-area.has-preview{padding:0;border-style:solid}
.frm-upload-icon{font-size:1.8rem;margin-bottom:6px;opacity:.5}
.frm-upload-text{font-size:.78rem;color:var(--tx3)}
.frm-upload-hint{font-size:.68rem;color:var(--tx4);margin-top:4px}
.frm-preview{width:100%;height:180px;object-fit:cover;display:block;border-radius:6px}
.frm-preview-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.det-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--card);border:none;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx);z-index:3;box-shadow:var(--sh)}
.det-c{padding:28px}
.det-t{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--dk)}
.det-sub{font-style:italic;color:var(--tx3);font-size:.88rem;margin-bottom:16px}
.taxo{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
.taxo span{font-size:.7rem;padding:3px 9px;border-radius:4px;background:var(--bg);color:var(--tx3);border:1px solid var(--bd2)}
.taxo span b{color:var(--tx2);font-weight:600}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:20px}
.ic{padding:12px;background:var(--bg);border-radius:6px}
.ic-l{font-size:.68rem;color:var(--tx4);margin-bottom:2px}
.ic-v{font-weight:600;font-size:.84rem}
.sec{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;color:var(--dk);margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--bd2)}
.pr{font-size:.88rem;color:var(--tx2);line-height:1.75}
.det-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:16px}

/* COMPARE */
.cmpf{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--dk);color:#fff;padding:10px 20px;border-radius:100px;box-shadow:var(--sh2);z-index:90;display:flex;align-items:center;gap:10px;transition:transform .3s;white-space:nowrap;font-size:.85rem}
.cmpf.vis{transform:translateX(-50%) translateY(0)}
.cmpf button{padding:6px 14px;border-radius:100px;font-size:.78rem;font-weight:600;border:none;cursor:pointer}
.cg{background:#BAF187;color:#022539;font-weight:700}.cc{background:rgba(255,255,255,.15);color:rgba(255,255,255,.75)}
.ctbl{width:100%;border-collapse:collapse;font-size:.82rem}
.ctbl th,.ctbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
.ctbl th{color:var(--tx4);font-weight:500;font-size:.73rem;width:100px}
.cth{text-align:center;padding:16px 8px}
.cth .e{font-size:2rem}.cth .n{font-family:'Playfair Display',serif;font-size:.88rem;font-weight:700;margin-top:4px}
.cwrap{overflow-x:auto}

/* QUIZ */
.qp{max-width:540px;margin:0 auto}
.qprog{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:.78rem;color:var(--tx3)}
.qbar{flex:1;height:3px;background:var(--bd);border-radius:3px;overflow:hidden}.qfill{height:100%;background:var(--gr);transition:width .3s}
.qc{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.qv{height:150px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative}
.qv::before{content:'';position:absolute;inset:0;opacity:.08;background:radial-gradient(circle at 40% 50%,currentColor,transparent 70%)}
.qbod{padding:20px}
.qq{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;text-align:center;margin-bottom:4px}
.qh{text-align:center;font-size:.78rem;color:var(--tx4);font-style:italic;margin-bottom:14px}
.qos{display:flex;flex-direction:column;gap:7px}
.qo{padding:10px 16px;border:2px solid var(--bd);border-radius:6px;background:var(--bg);font-size:.86rem;font-weight:500;color:var(--tx);text-align:left;cursor:pointer;transition:all .12s}
.qo:hover:not(.d){border-color:var(--grl);background:var(--grl2)}
.qo.ok{border-color:#184A3A;background:#BAF187;color:#022539}.qo.no{border-color:#c0392b;background:#fce8e6;color:#922b21}
.qft{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--bd)}
.qsc{font-weight:600;color:var(--dk);font-size:.82rem}
.qnx{padding:7px 18px;background:var(--dk);color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.82rem;cursor:pointer}
.qnx:disabled{opacity:.3;cursor:default}
.qres{text-align:center;padding:36px 20px}.qres .big{font-size:3.5rem;margin-bottom:10px}
.nores{text-align:center;padding:50px 20px;color:var(--tx3)}.nores .big{font-size:2.5rem;margin-bottom:8px}
.back{padding:5px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);font-size:.78rem;color:var(--tx3);cursor:pointer;margin-bottom:14px;display:inline-flex;align-items:center;gap:4px}
.back:hover{border-color:var(--gr);color:var(--gr)}
.stitle{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--dk);margin-bottom:16px}

/* ADD/EDIT FORM */
.add-btn{background:rgba(186,241,135,.15)!important;color:#BAF187!important;border-color:rgba(186,241,135,.3)!important}
.frm-head{padding:24px 28px 16px;border-bottom:1px solid var(--bd)}
.frm-title{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--dk)}
.frm-sub{font-size:.78rem;color:var(--tx4);margin-top:2px}
.frm-body{padding:20px 28px 28px;max-height:65vh;overflow-y:auto}
.frm-section{font-size:.72rem;font-weight:600;color:var(--gr);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd2)}
.frm-section:first-child{margin-top:0}
.frm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.frm-row.full{grid-template-columns:1fr}
.frm-row.tri{grid-template-columns:1fr 1fr 1fr}
.frm-field{display:flex;flex-direction:column;gap:3px}
.frm-label{font-size:.7rem;font-weight:600;color:var(--tx3)}
.frm-label .req{color:#c0392b}
.frm-input{padding:8px 12px;border:1px solid var(--bd);border-radius:6px;font-size:.85rem;font-family:inherit;background:var(--bg);color:var(--tx);outline:none;transition:border-color .15s}
.frm-input:focus{border-color:var(--gr)}
.frm-input::placeholder{color:var(--tx4)}
textarea.frm-input{resize:vertical;min-height:60px;line-height:1.5}
select.frm-input{cursor:pointer}
.frm-foot{padding:16px 28px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px}
.frm-save{padding:9px 24px;background:var(--gr);color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer;transition:opacity .15s}
.frm-save:hover{opacity:.85}
.frm-cancel{padding:9px 18px;background:none;border:1px solid var(--bd);border-radius:6px;color:var(--tx3);font-size:.85rem;cursor:pointer}
.frm-cancel:hover{border-color:var(--gr);color:var(--gr)}
.frm-del{padding:9px 16px;background:none;border:1px solid #e74c3c44;border-radius:6px;color:#c0392b;font-size:.82rem;cursor:pointer;margin-right:auto}
.frm-del:hover{background:#fdecea;border-color:#c0392b}
/* ADMIN */
.admin-btn{position:relative}
.admin-btn.unlocked{background:rgba(186,241,135,.15)!important;color:#BAF187!important;border-color:rgba(186,241,135,.3)!important}
.admin-pop{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;width:260px;box-shadow:var(--sh2);z-index:120;display:none}
.admin-pop.show{display:block}
.admin-pop-title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--dk);margin-bottom:4px}
.admin-pop-sub{font-size:.72rem;color:var(--tx4);margin-bottom:12px}
.admin-pop input{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:6px;font-size:.85rem;font-family:inherit;background:var(--bg);color:var(--tx);outline:none;margin-bottom:8px}
.admin-pop input:focus{border-color:var(--gr)}
.admin-pop-btns{display:flex;gap:6px}
.admin-pop-ok{flex:1;padding:7px;background:var(--gr);color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.82rem;cursor:pointer}
.admin-pop-cancel{padding:7px 12px;background:none;border:1px solid var(--bd);border-radius:6px;color:var(--tx3);font-size:.82rem;cursor:pointer}
.admin-pop-err{font-size:.72rem;color:#c0392b;margin-bottom:6px;display:none}
.admin-pop-err.show{display:block}
body:not(.is-admin) .add-btn{display:none}
body:not(.is-admin) .det-edit{display:none}
.frm-msg{font-size:.78rem;padding:8px 12px;border-radius:6px;margin-bottom:12px}
.frm-msg.ok{background:#d5f5e3;color:#1e8449}
.frm-msg.err{background:#fdecea;color:#c0392b}
.det-edit{padding:7px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);font-size:.82rem;font-weight:500;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.det-edit:hover{border-color:var(--gr);color:var(--gr)}
.user-badge{display:inline-block;font-size:.6rem;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(186,241,135,.2);color:var(--gr);margin-left:6px;vertical-align:middle}
/* DETAIL SECTIONS */
.det-section{margin:20px 0 12px;padding:12px 14px;background:var(--bg);border-radius:8px;border:1px solid var(--bd2)}
.det-section-title{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:600;color:var(--dk);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bd2)}
.det-field{display:flex;gap:8px;padding:5px 0;font-size:.84rem}
.det-field-label{font-weight:600;color:var(--tx3);min-width:105px;flex-shrink:0}
.det-field-value{color:var(--tx);line-height:1.5}
/* GALLERY */
.det-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.det-gallery-item{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.det-gallery-item img{width:100%;height:100%;object-fit:cover}
.det-gallery-item .gallery-empty{color:var(--tx4);font-size:.7rem;text-align:center;padding:8px}
/* FORM GALLERY */
.frm-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.frm-gallery-slot{aspect-ratio:1;border:2px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;transition:all .15s}
.frm-gallery-slot:hover{border-color:var(--gr);background:var(--grl2)}
.frm-gallery-slot.has-img{border-style:solid;padding:0}
.frm-gallery-slot img{width:100%;height:100%;object-fit:cover}
.frm-gallery-slot .slot-placeholder{text-align:center;font-size:.65rem;color:var(--tx4);padding:6px}
.frm-gallery-slot .slot-placeholder svg{display:block;margin:0 auto 4px;opacity:.4}
.frm-gallery-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;align-items:center;justify-content:center;cursor:pointer}
.lightbox.open{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
@media(max-width:480px){.frm-row{grid-template-columns:1fr}.frm-row.tri{grid-template-columns:1fr 1fr}.det-field{flex-direction:column;gap:2px}.det-field-label{min-width:auto}}
</style>
</head>

<script>
// ============ FAMILIES ============
const FAM=[
{id:"asteraceae",name:"Họ Cúc",latin:"Asteraceae",aka:"Compositae",emoji:"🌼",order:"Asterales",color:"#E6A817",
genera:"~1.900 chi",species:"~32.000 loài",
desc:"Họ Cúc là họ thực vật có hoa lớn nhất hành tinh. Đặc trưng bởi cụm hoa hình đầu (capitulum) — mỗi 'bông hoa' thực ra là tập hợp hàng trăm hoa nhỏ. Phân bố toàn cầu, từ đồng cỏ đến sa mạc."},
{id:"rosaceae",name:"Họ Hồng",latin:"Rosaceae",emoji:"🌹",order:"Rosales",color:"#D64B6A",
genera:"~90 chi",species:"~3.000 loài",
desc:"Họ Hồng gồm nhiều loài hoa đẹp nhất và cây ăn quả quan trọng nhất (táo, đào, mận, lê, dâu tây). Hoa thường có 5 cánh, nhiều nhị, đối xứng toả tròn."},
{id:"orchidaceae",name:"Họ Lan",latin:"Orchidaceae",emoji:"🌺",order:"Asparagales",color:"#9C27B0",
genera:"~880 chi",species:"~28.000 loài",
desc:"Họ Lan là một trong hai họ thực vật có hoa lớn nhất (cùng Asteraceae). Nổi tiếng với hình dạng hoa kỳ lạ, cơ chế thụ phấn phức tạp và quan hệ cộng sinh với nấm. Phần lớn là phong lan (epiphyte)."},
{id:"solanaceae",name:"Họ Cà",latin:"Solanaceae",emoji:"🌙",order:"Solanales",color:"#5C6BC0",
genera:"~100 chi",species:"~2.700 loài",
desc:"Họ Cà chứa nhiều loài kinh tế quan trọng (cà chua, khoai tây, ớt) lẫn loài cực độc (cà độc dược, belladonna). Hoa thường hình phễu hoặc hình sao, 5 cánh dính nhau."},
{id:"fabaceae",name:"Họ Đậu",latin:"Fabaceae",aka:"Leguminosae",emoji:"🦋",order:"Fabales",color:"#FF7043",
genera:"~750 chi",species:"~20.000 loài",
desc:"Họ Đậu là họ lớn thứ 3 trong thực vật có hoa. Đặc trưng bởi quả dạng đậu (legume) và khả năng cố định đạm nhờ vi khuẩn cộng sinh Rhizobium ở rễ. Hoa dạng bướm đặc trưng."},
{id:"liliaceae",name:"Họ Huệ",latin:"Liliaceae",emoji:"🌷",order:"Liliales",color:"#E91E63",
genera:"~16 chi",species:"~600 loài",
desc:"Họ Huệ (nghĩa hẹp hiện đại) gồm các loài hoa từ củ với hoa 6 cánh xếp thành 2 vòng, 6 nhị. Tulip, lily, và nhiều loài hoa cắt cành quan trọng thuộc họ này."},
{id:"lamiaceae",name:"Họ Hoa Môi",latin:"Lamiaceae",aka:"Labiatae",emoji:"💜",order:"Lamiales",color:"#7B1FA2",
genera:"~236 chi",species:"~7.200 loài",
desc:"Họ Hoa Môi đặc trưng bởi thân vuông, lá mọc đối, hoa dạng môi (2 môi trên-dưới) và chứa nhiều tinh dầu thơm. Gồm hầu hết các loài thảo mộc gia vị và hương liệu nổi tiếng."},
{id:"malvaceae",name:"Họ Cẩm Quỳ",latin:"Malvaceae",emoji:"🌺",order:"Malvales",color:"#E53935",
genera:"~244 chi",species:"~4.300 loài",
desc:"Họ Cẩm Quỳ gồm nhiều loài hoa nhiệt đới rực rỡ. Đặc trưng: hoa lớn, 5 cánh, cột nhị hợp (staminal column) — nhị dính thành ống bao quanh nhuỵ. Bao gồm cả cây bông vải."},
{id:"apocynaceae",name:"Họ Trúc Đào",latin:"Apocynaceae",emoji:"🤍",order:"Gentianales",color:"#78909C",
genera:"~400 chi",species:"~5.000 loài",
desc:"Họ Trúc Đào nổi tiếng với hoa thơm đẹp nhưng nhiều loài cực độc. Đặc trưng bởi nhựa trắng (latex) và hoa 5 cánh xoắn. Bao gồm cả nhóm cây mọng nước cũ (Asclepiadaceae)."},
{id:"amaryllidaceae",name:"Họ Thuỷ Tiên",latin:"Amaryllidaceae",emoji:"💛",order:"Asparagales",color:"#FDD835",

{id:"hydrangeaceae",name:"Họ Cẩm Tú Cầu",latin:"Hydrangeaceae",emoji:"💠",order:"Cornales",color:"#42A5F5",
genera:"~17 chi",species:"~260 loài",
desc:"Họ nhỏ nhưng nổi bật với Hydrangea — loài hoa đổi màu theo pH đất. Đặc trưng: cụm hoa lớn, hoa ở rìa thường bất thụ với đài lớn tạo hiệu ứng thị giác."},
{id:"magnoliaceae",name:"Họ Ngọc Lan",latin:"Magnoliaceae",emoji:"🤍",order:"Magnoliales",color:"#A1887F",
genera:"~18 chi",species:"~300 loài",
desc:"Họ Ngọc Lan là một trong những họ thực vật có hoa cổ xưa nhất — hoá thạch 95 triệu năm. Hoa lớn, nhiều cánh xếp xoắn ốc, thơm. Được coi là 'sống hoá thạch' của thế giới thực vật."},
{id:"ranunculaceae",name:"Họ Mao Lương",latin:"Ranunculaceae",emoji:"✨",order:"Ranunculales",color:"#66BB6A",
genera:"~43 chi",species:"~2.300 loài",
desc:"Họ Mao Lương gồm nhiều loài hoa cắt cành cao cấp. Đặc trưng: lá xẻ thuỳ, hoa đa dạng hình dạng, nhiều nhị và nhuỵ rời. Phần lớn loài có độc tính."},
{id:"oleaceae",name:"Họ Nhài",latin:"Oleaceae",emoji:"⚪",order:"Lamiales",color:"#4DB6AC",
genera:"~25 chi",species:"~600 loài",
desc:"Họ Nhài gồm các loài nổi tiếng về hương thơm (nhài, tử đinh hương) và kinh tế (ô-liu). Hoa thường 4 cánh dính, 2 nhị. Nhiều loài là cây cảnh quan trọng."},
{id:"caryophyllaceae",name:"Họ Cẩm Chướng",latin:"Caryophyllaceae",emoji:"💮",order:"Caryophyllales",color:"#EC407A",
genera:"~86 chi",species:"~2.200 loài",
desc:"Họ Cẩm Chướng đặc trưng bởi thân phình ở đốt, lá mọc đối, hoa 5 cánh thường xẻ. Gồm cẩm chướng, baby's breath và nhiều loài hoa cắt cành phổ biến."},
{id:"iridaceae",name:"Họ Diên Vĩ",latin:"Iridaceae",emoji:"⚜️",order:"Asparagales",color:"#5E35B1",
genera:"~65 chi",species:"~2.200 loài",
desc:"Họ Diên Vĩ gồm các loài hoa từ củ/thân rễ với hoa 3 cánh đài + 3 cánh tràng thường rất sặc sỡ. Iris, gladiolus, crocus và nghệ tây (saffron) đều thuộc họ này."},
{id:"nelumbonaceae",name:"Họ Sen",latin:"Nelumbonaceae",emoji:"🪷",order:"Proteales",color:"#F48FB1",
genera:"1 chi",species:"2 loài",
desc:"Họ Sen chỉ có 1 chi (Nelumbo) với 2 loài — sen Á (N. nucifera) và sen Mỹ (N. lutea). Dù nhỏ, họ này có ý nghĩa văn hoá khổng lồ trong Phật giáo và Hindu giáo. Lá sen có hiệu ứng siêu kỵ nước (lotus effect)."},
{id:"convolvulaceae",name:"Họ Bìm Bìm",latin:"Convolvulaceae",emoji:"🌀",order:"Solanales",color:"#26A69A",
genera:"~60 chi",species:"~1.900 loài",
desc:"Họ Bìm Bìm gồm các loài dây leo với hoa hình phễu đặc trưng. Morning Glory nở rạng sáng và tàn trước trưa. Họ này cũng bao gồm khoai lang — cây lương thực quan trọng toàn cầu."},
{id:"nyctaginaceae",name:"Họ Hoa Giấy",latin:"Nyctaginaceae",emoji:"🌸",order:"Caryophyllales",color:"#D81B60",
genera:"~33 chi",species:"~400 loài",
desc:"Họ Hoa Giấy nổi bật nhất với Bougainvillea — nhưng phần sặc sỡ không phải cánh hoa mà là lá bắc (bract). Tên họ từ 'nyctis' (đêm) vì nhiều loài nở hoa ban đêm."},
{id:"papaveraceae",name:"Họ Anh Túc",latin:"Papaveraceae",emoji:"🔴",order:"Ranunculales",color:"#FF5722",
genera:"~42 chi",species:"~800 loài",
desc:"Họ Anh Túc gồm các loài hoa cánh mỏng như giấy lụa, thường 4 cánh, nhiều nhị. Papaver somniferum là nguồn thuốc phiện và morphine. Poppy đỏ là biểu tượng tưởng niệm chiến tranh ở nhiều nước."}
];

// ============ STATE ============
let S={cat:'all',genus:null,view:'g',q:'',bk:new Set(),cmp:[],page:'home',qi:0,qs:0,qd:false,qq:[],expanded:new Set()};
const famMap=Object.fromEntries(FAM.map(f=>[f.id,f]));
const spMap=Object.fromEntries(SP.map(s=>[s.id,s]));

// Build genus index: { familyId: [ {genus, latin, count, species[]} ] }
const genusIndex={};
FAM.forEach(f=>{
  const sps=SP.filter(s=>s.f===f.id);
  const gmap={};
  sps.forEach(s=>{
    if(!gmap[s.genus])gmap[s.genus]={genus:s.genus,count:0,species:[]};
    gmap[s.genus].count++;
    gmap[s.genus].species.push(s);
  });
  genusIndex[f.id]=Object.values(gmap).sort((a,b)=>a.genus.localeCompare(b.genus));
});

// ============ RENDER ============
function init(){renderSideL();renderSideR();renderHome();}

function renderSideL(){
  const s=document.getElementById('sideL');
  let h=`<div class="sh">Họ thực vật · Family</div>
  <button class="si ${S.cat==='all'&&!S.genus?'on':''}" onclick="setCat('all')">Tất cả các họ<span class="c">${SP.length}</span></button>`;
  FAM.forEach(f=>{
    const cnt=SP.filter(sp=>sp.f===f.id).length;
    const isActive=S.cat===f.id;
    h+=`<button class="fi ${isActive?'on':''}" onclick="setCat('${f.id}')">
      <div class="fi-info">
        <div class="fi-latin">${f.latin}</div>
        <div class="fi-vn">${f.name}</div>
      </div>
      <span class="fi-cnt">${cnt}</span>
    </button>`;
  });
  h+=`<div class="sdiv"></div><div class="sh">Tính năng</div>
  <button class="si" onclick="goQuiz()">Quiz kiến thức</button>
  <button class="si" onclick="goBk()">Đã lưu (${S.bk.size})</button>`;
  s.innerHTML=h;
}

function renderSideR(){
  const sr=document.getElementById('sideR');
  if(S.cat==='all'){
    // Show all families summary
    let h=`<div class="sr-header"><div class="sr-title">Tất cả các Chi</div><div class="sr-sub">${new Set(SP.map(s=>s.genus)).size} chi trong ${FAM.length} họ</div></div>`;
    FAM.forEach(f=>{
      const genera=genusIndex[f.id]||[];
      if(!genera.length)return;
      h+=`<div style="padding:8px 16px 4px;font-size:.68rem;font-weight:600;color:var(--tx4);background:var(--bg);border-bottom:1px solid var(--bd2)">${f.name}</div>`;
      genera.forEach(g=>{
        h+=`<div class="gi" onclick="setGenus('${f.id}','${g.genus}')">
          <div class="gi-info"><div class="gi-name">${g.genus}</div>
          <div class="gi-detail">${g.species.map(s=>s.name).join(', ')}</div></div>
          <span class="gi-count">${g.count}</span>
        </div>`;
      });
    });
    sr.innerHTML=h;
  } else {
    const f=famMap[S.cat];
    const genera=genusIndex[S.cat]||[];
    let h=`<div class="sr-header">
      <div class="sr-fam-tag" style="background:${f.color}18;color:${f.color};border:1px solid ${f.color}33">${f.name}</div>
      <div class="sr-title">Chi thuộc ${f.latin}</div>
      <div class="sr-sub">${genera.length} chi · ${SP.filter(s=>s.f===f.id).length} loài</div>
    </div>`;
    if(!genera.length){
      h+=`<div class="sr-empty"><div class="big">—</div>Không có dữ liệu chi.</div>`;
    } else {
      genera.forEach(g=>{
        const isActive=S.genus===g.genus;
        h+=`<div class="gi ${isActive?'on':''}" onclick="setGenus('${f.id}','${g.genus}')">
          <div class="gi-info"><div class="gi-name">${g.genus}</div>
          <div class="gi-detail">${g.count} loài trong từ điển</div></div>
          <span class="gi-count">${g.count}</span>
        </div>`;
        // Show species under genus
        h+=`<div class="gi-species">`;
        g.species.forEach(sp=>{
          h+=`<div class="gi-sp" onclick="event.stopPropagation();openD(${sp.id})">${sp.name} <span style="font-style:italic;opacity:.6">— ${sp.latin}</span></div>`;
        });
        h+=`</div>`;
      });
    }
    sr.innerHTML=h;
  }
}

function renderHome(){
  S.page='home';
  const m=document.getElementById('mn');
  const filtered=getF();
  let h='';

  if(S.cat==='all'&&!S.q&&!S.genus){
    // Show stats
    h+=`<div style="display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none">
    <div style="flex-shrink:0;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:8px;display:flex;align-items:center;gap:8px">
      <span class="dsp" style="font-size:1.3rem;font-weight:700;color:var(--dk)">${SP.length}</span><span style="font-size:.75rem;color:var(--tx3)">Loài hoa</span>
    </div>
    <div style="flex-shrink:0;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:8px;display:flex;align-items:center;gap:8px">
      <span class="dsp" style="font-size:1.3rem;font-weight:700;color:var(--dk)">${FAM.length}</span><span style="font-size:.75rem;color:var(--tx3)">Họ thực vật</span>
    </div>
    <div style="flex-shrink:0;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:8px;display:flex;align-items:center;gap:8px">
      <span class="dsp" style="font-size:1.3rem;font-weight:700;color:var(--dk)">${new Set(SP.map(s=>s.genus)).size}</span><span style="font-size:.75rem;color:var(--tx3)">Chi</span>
    </div></div>`;

    // Group by family
    FAM.forEach(f=>{
      const sps=SP.filter(sp=>sp.f===f.id);
      h+=famHeader(f);
      h+=S.view==='g'?`<div class="grid">${sps.map(gridCard).join('')}</div>`
        :`<div class="lst">${sps.map(listItem).join('')}</div>`;
    });
  } else if(S.genus){
    // Genus view
    const f=famMap[S.cat];
    const genSps=filtered;
    if(f){
      h+=`<div class="fam-hdr" style="border-left:4px solid ${f.color}">
        <div class="fam-badge">⬡ ${f.latin}</div>
        <div class="fam-name">Chi <em style="font-style:italic">${S.genus}</em></div>
        <div class="fam-latin">Thuộc ${f.name} (${f.latin}) — ${genSps.length} loài trong từ điển</div>
      </div>`;
    }
    if(!genSps.length){
      h+=`<div class="nores"><div class="big">—</div>Không tìm thấy kết quả.</div>`;
    } else {
      h+=S.view==='g'?`<div class="grid">${genSps.map(gridCard).join('')}</div>`
        :`<div class="lst">${genSps.map(listItem).join('')}</div>`;
    }
  } else {
    // Filtered by family or search
    if(!filtered.length){
      h+=`<div class="nores"><div class="big">—</div>Không tìm thấy kết quả.</div>`;
    } else if(S.cat!=='all'){
      const f=famMap[S.cat];
      if(f)h+=famHeader(f);
      // Group by genus within family
      const genera=genusIndex[S.cat]||[];
      genera.forEach(g=>{
        const gSps=filtered.filter(p=>p.genus===g.genus);
        if(gSps.length){
          h+=`<div style="margin-bottom:6px;display:flex;align-items:center;gap:8px">
            <span style="font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;font-style:italic;color:var(--gr)">${g.genus}</span>
            <span style="font-size:.7rem;color:var(--tx4)">${gSps.length} loài</span>
            <span style="flex:1;height:1px;background:var(--bd2)"></span>
          </div>`;
          h+=S.view==='g'?`<div class="grid">${gSps.map(gridCard).join('')}</div>`
            :`<div class="lst">${gSps.map(listItem).join('')}</div>`;
        }
      });
    } else {
      h+=`<div class="stitle">Kết quả tìm kiếm (${filtered.length})</div>`;
      h+=S.view==='g'?`<div class="grid">${filtered.map(gridCard).join('')}</div>`
        :`<div class="lst">${filtered.map(listItem).join('')}</div>`;
    }
  }
  m.innerHTML=h;
}

function famHeader(f){
  return `<div class="fam-hdr" style="border-left:4px solid ${f.color}">
    <div class="fam-badge">⬡ ${f.latin}${f.aka?' ('+f.aka+')':''}</div>
    <div class="fam-name">${f.name}</div>
    <div class="fam-latin">${f.latin} — ${f.genera}, ${f.species}</div>
    <div class="fam-desc">${f.desc}</div>
  </div>`;
}

function gridCard(p){
  const img=getFlowerImg(p.id);
  const hasImg=!!img;
  return `<div class="cd" onclick="openD(${p.id})">
    <div class="cd-acts">
      <button class="ca ${S.bk.has(p.id)?'bk':''}" onclick="event.stopPropagation();tBk(${p.id})">★</button>
      <button class="ca ${S.cmp.includes(p.id)?'cp':''}" onclick="event.stopPropagation();tCmp(${p.id})">⚖</button>
    </div>
    <div class="cd-v ${hasImg?'has-img':''}" style="${hasImg?'':'background:'+p.grad}">
      ${hasImg?`<img class="cd-img" src="${img.data}" alt="${p.name}">`:`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"><path d="M12 3c-1.5 3-5 5-5 9a5 5 0 0010 0c0-4-3.5-6-5-9z"/><path d="M12 12v7"/><path d="M9 16c1.5-1 4.5-1 6 0"/></svg>`}
    </div>
    <div class="cd-b">
      <div class="cd-fam">${famMap[p.f]?.name} · <i>${p.genus}</i></div>
      <div class="cd-n">${p.name}</div>
      <div class="cd-l">${p.latin}</div>
      <div class="cd-d">${p.desc.substring(0,90)}...</div>
    </div>
    <div class="cd-f">${p.tags.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  </div>`;
}

function listItem(p){
  return `<div class="li" onclick="openD(${p.id})">
    <div class="li-e" style="font-size:1.1rem;opacity:.45"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3c-1.5 3-5 5-5 9a5 5 0 0010 0c0-4-3.5-6-5-9z"/><path d="M12 12v7"/></svg></div>
    <div class="li-i">
      <div class="li-n">${p.name} <span style="font-weight:400;color:var(--tx4);font-size:.78rem">— ${p.en}</span></div>
      <div class="li-l">${p.latin} · ${famMap[p.f]?.latin}</div>
      <div class="li-m"><span>${p.origin}</span><span>${p.season}</span></div>
    </div>
    <div style="display:flex;gap:3px">
      <button class="ca ${S.bk.has(p.id)?'bk':''}" onclick="event.stopPropagation();tBk(${p.id})">★</button>
      <button class="ca ${S.cmp.includes(p.id)?'cp':''}" onclick="event.stopPropagation();tCmp(${p.id})">⚖</button>
    </div>
  </div>`;
}

// FILTER
function getF(){
  let a=S.cat==='all'?[...SP]:SP.filter(p=>p.f===S.cat);
  if(S.genus) a=a.filter(p=>p.genus===S.genus);
  if(S.q){
    const q=S.q.toLowerCase();
    a=a.filter(p=>p.name.toLowerCase().includes(q)||p.en.toLowerCase().includes(q)||
      p.latin.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||
      p.meaning.toLowerCase().includes(q)||p.tags.some(t=>t.toLowerCase().includes(q))||
      (famMap[p.f]?.name||'').toLowerCase().includes(q)||(famMap[p.f]?.latin||'').toLowerCase().includes(q)||
      p.genus.toLowerCase().includes(q)||
      p.colors.some(c=>c.toLowerCase().includes(q)));
  }
  return a;
}

function setCat(c){S.cat=c;S.genus=null;S.page='home';renderSideL();renderSideR();renderHome();document.getElementById('sideL').classList.remove('open');}
function setGenus(fid,g){S.cat=fid;S.genus=g;S.page='home';renderSideL();renderSideR();renderHome();document.getElementById('sideL').classList.remove('open');document.getElementById('sideR').classList.remove('open');}
function doSearch(){S.q=document.getElementById('sinp').value;if(S.page!=='home'){S.page='home';S.cat='all';S.genus=null;renderSideL();renderSideR();}renderHome();}
function setV(v){S.view=v;document.getElementById('vg').classList.toggle('on',v==='g');document.getElementById('vl').classList.toggle('on',v==='l');if(S.page==='home')renderHome();else if(S.page==='bk')goBk();}

function openD(id){
  const p=spMap[id];if(!p)return;const f=famMap[p.f];
  const img=getFlowerImg(p.id);
  const hasImg=!!img;
  const gal=(img&&img.gallery)||[];

function simpleHash(str){
  let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return 'h'+Math.abs(h).toString(36);
}

function resizeImage(file,maxW,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

// Load user flowers from localStorage
function loadUserFlowers(){
  try{
    const d=localStorage.getItem('enc_flowers');
    if(d){
      const arr=JSON.parse(d);
      arr.forEach(uf=>{
        if(!spMap[uf.id]){
          SP.push(uf);spMap[uf.id]=uf;
        }
      });
      // Rebuild genus index
      FAM.forEach(f=>{
        const sps=SP.filter(s=>s.f===f.id);
        const gmap={};
        sps.forEach(s=>{
          if(!gmap[s.genus])gmap[s.genus]={genus:s.genus,count:0,species:[]};
          gmap[s.genus].count++;gmap[s.genus].species.push(s);
        });
        genusIndex[f.id]=Object.values(gmap).sort((a,b)=>a.genus.localeCompare(b.genus));
      });
      // Update family counts
      FAM.forEach(f=>{const c=SP.filter(s=>s.f===f.id).length;});
    }
  }catch(e){console.log('Storage read error',e)}
}

function saveUserFlowers(){
  try{
    const userFlowers=SP.filter(s=>s.userAdded);
    localStorage.setItem('enc_flowers',JSON.stringify(userFlowers));
  }catch(e){console.log('Storage write error',e)}
}

function rebuildIndex(){
  FAM.forEach(f=>{
    const sps=SP.filter(s=>s.f===f.id);
    const gmap={};
    sps.forEach(s=>{
      if(!gmap[s.genus])gmap[s.genus]={genus:s.genus,count:0,species:[]};
      gmap[s.genus].count++;gmap[s.genus].species.push(s);
    });
    genusIndex[f.id]=Object.values(gmap).sort((a,b)=>a.genus.localeCompare(b.genus));
  });
}

    setTimeout(()=>showImgPreview(existImg.data),50);

function closeForm(){
  document.getElementById('formMo').classList.remove('open');
  document.body.style.overflow='';
  editingId=null;
}

function showFrmMsg(msg,ok){
  const el=document.getElementById('frmMsg');
  el.innerHTML=`<div class="frm-msg ${ok?'ok':'err'}">${msg}</div>`;
  if(ok)setTimeout(()=>{el.innerHTML='';},3000);
}

const GRADIENTS=[
  "linear-gradient(135deg,#FFE4E9,#FBB1BD)","linear-gradient(135deg,#FDE8EF,#F0B8CC)",
  "linear-gradient(135deg,#F3E5F5,#CE93D8)","linear-gradient(135deg,#E3F2FD,#90CAF9)",
  "linear-gradient(135deg,#FFF9C4,#FFD54F)","linear-gradient(135deg,#E8F5E9,#81C784)",
  "linear-gradient(135deg,#FFF3E0,#FFAB91)","linear-gradient(135deg,#FCE4EC,#F48FB1)",
  "linear-gradient(135deg,#E8EAF6,#7C4DFF)","linear-gradient(135deg,#FFFDE7,#FFE082)",
  "linear-gradient(135deg,#F1F8E9,#AED581)","linear-gradient(135deg,#E0F7FA,#00897B)"
];

function saveForm(){
  const name=document.getElementById('f_name').value.trim();
  const en=document.getElementById('f_en').value.trim();
  const latin=document.getElementById('f_latin').value.trim();
  const genus=document.getElementById('f_genus').value.trim();
  const fam=document.getElementById('f_fam').value;
  const desc=document.getElementById('f_desc').value.trim();

  if(!name||!en||!latin||!genus||!desc){
    showFrmMsg('Vui lòng điền các trường có dấu * (tên, tên Anh, tên khoa học, chi, mô tả).',false);
    return;
  }

  const selFam=famMap[fam];
  const flower={
    id: editingId || Date.now(),
    f: fam,
    name, en, latin, genus,
    emoji: '🌿',
    grad: GRADIENTS[Math.floor(Math.random()*GRADIENTS.length)],
    colors: document.getElementById('f_colors').value.split(',').map(s=>s.trim()).filter(Boolean),
    season: document.getElementById('f_season').value.trim()||'—',
    origin: document.getElementById('f_origin').value.trim()||'—',
    height: document.getElementById('f_height').value.trim()||'—',
    life: document.getElementById('f_life').value.trim()||'—',
    sun: document.getElementById('f_sun').value.trim()||'—',
    water: document.getElementById('f_water').value.trim()||'—',
    soil: document.getElementById('f_soil').value.trim()||'—',
    meaning: document.getElementById('f_meaning').value.trim()||'—',
    order: selFam?.order||'—',
    plantType: document.getElementById('f_plantType').value.trim()||'',
    stem: document.getElementById('f_stem').value.trim()||'',
    rootType: document.getElementById('f_rootType').value.trim()||'',
    flower: document.getElementById('f_flower').value.trim()||'',
    reproduction: document.getElementById('f_reproduction').value.trim()||'',
    desc,
    care: document.getElementById('f_care').value.trim()||'—',
    fact: document.getElementById('f_fact').value.trim()||'—',
    tags: document.getElementById('f_tags').value.split(',').map(s=>s.trim()).filter(Boolean),
    userAdded: true
  };

  if(editingId){
    // Update existing
    const idx=SP.findIndex(s=>s.id===editingId);
    if(idx>-1){
      flower.grad=SP[idx].grad; // keep gradient
      SP[idx]=flower;
      spMap[editingId]=flower;
    }
  } else {
    SP.push(flower);
    spMap[flower.id]=flower;
  }

  rebuildIndex();
  saveUserFlowers();

  // Save image + gallery
  const imgSource=document.getElementById('f_imgSrc').value.trim();
  const existingImg=flowerImages[flower.id]||{};
  const cleanGal=pendingGallery.filter(g=>g&&g.data);
  const finalGal=cleanGal.length?cleanGal:(existingImg.gallery||[]);
  if(pendingImgData||existingImg.data){
    flowerImages[flower.id]={data:pendingImgData||existingImg.data,source:imgSource||existingImg.source||'',gallery:finalGal};
    saveFlowerImages();
  } else if(finalGal.length){
    flowerImages[flower.id]={data:null,source:'',gallery:finalGal};
    saveFlowerImages();
  } else {
    delete flowerImages[flower.id];
    saveFlowerImages();
  }

  renderSideL();renderSideR();renderHome();
  closeForm();
  if(editingId){openD(editingId);}
}

function delFlower(id){
  if(!confirm('Bạn có chắc muốn xoá loài hoa này?'))return;
  const idx=SP.findIndex(s=>s.id===id);
  if(idx>-1)SP.splice(idx,1);
  delete spMap[id];
  delete flowerImages[id];
  S.bk.delete(id);
  S.cmp=S.cmp.filter(c=>c!==id);
  rebuildIndex();
  saveUserFlowers();
  saveFlowerImages();
  closeForm();clD();
  renderSideL();renderSideR();renderHome();
}

// Load on startup
loadFlowerImages();
loadUserFlowers();
updateAdminUI();
init();
</script>
